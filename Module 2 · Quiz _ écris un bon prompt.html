<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Module 2 · Quiz : écris un bon prompt</title>
<style>
:root{--bg:#F4F0FC;--card:#FFFFFF;--ink:#1B1440;--mute:#5B5478;--line:#DDD3F2;--vio:#7B2CBF;--blue:#1E6FD9;--pink:#E5177A;--ora:#B86E00;--ok:#0E8F5F;--okbg:#E3F7EE;--ko:#C0262D;--kobg:#FCE8E9;--glow:rgba(123,44,191,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B24;--card:#16163A;--ink:#F3EFFF;--mute:#B7AEDB;--line:#2C2A5E;--vio:#A66BFF;--blue:#4C9BFF;--pink:#FF4FA0;--ora:#FBBF24;--ok:#4ADE9B;--okbg:#10382B;--ko:#FF7B82;--kobg:#401A24;--glow:rgba(166,107,255,.25)}}
:root[data-theme="dark"]{--bg:#0B0B24;--card:#16163A;--ink:#F3EFFF;--mute:#B7AEDB;--line:#2C2A5E;--vio:#A66BFF;--blue:#4C9BFF;--pink:#FF4FA0;--ora:#FBBF24;--ok:#4ADE9B;--okbg:#10382B;--ko:#FF7B82;--kobg:#401A24;--glow:rgba(166,107,255,.25)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;min-height:100vh;background-image:radial-gradient(60rem 30rem at 85% -10%,var(--glow),transparent 60%),radial-gradient(40rem 25rem at -10% 110%,rgba(30,111,217,.18),transparent 60%)}
main{max-width:720px;margin:0 auto;padding:32px 20px 56px}
h1{font:700 clamp(28px,6vw,42px)/1.15 Georgia,"Times New Roman",serif;margin:0 0 10px}
h2{font:700 clamp(20px,4.5vw,26px)/1.3 Georgia,serif;margin:0 0 18px}
.kick{color:var(--blue);font-weight:700;font-size:14px;margin:0 0 10px}
.bar{width:64px;height:5px;background:var(--pink);border-radius:3px;margin:18px 0}
p.lead{color:var(--mute);margin:0 0 22px;max-width:56ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 40px var(--glow)}
.btn{appearance:none;border:0;cursor:pointer;font-weight:700;font-size:16px;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--vio),var(--pink));padding:13px 26px;border-radius:12px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--mute);font-size:14px}
.track{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--vio),var(--pink));border-radius:6px;transition:width .4s}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 10px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--vio)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt:disabled{cursor:default;color:var(--ink)}
.chips{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.slot{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;color:var(--mute);font-size:14px;display:flex;gap:10px;align-items:center}
.slot.filled{border-style:solid;border-color:var(--vio);color:var(--ink);background:var(--glow)}
.slot.ok{border-color:var(--ok);background:var(--okbg)} .slot.ko{border-color:var(--ko);background:var(--kobg)}
.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--vio);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--okbg);border-left:4px solid var(--ok)} .fb.ko{background:var(--kobg);border-left:4px solid var(--ko)}
.fb b{display:block;margin-bottom:2px}
.score{font:700 64px/1 Georgia,serif;margin:6px 0}
.rev{border-top:1px solid var(--line);padding:12px 0;font-size:15px} .rev small{color:var(--mute);display:block}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.hide{display:none}
.lab{display:block;font-weight:700;margin:0 0 6px}.inp{width:100%;max-width:360px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 16px;display:block}
.cert{margin-top:26px;border-radius:18px;padding:10px;background:linear-gradient(135deg,var(--vio),var(--pink),var(--ora))}.cin{background:var(--card);border:2px solid var(--ora);border-radius:12px;padding:34px 22px;text-align:center}
.cs{color:var(--blue);font-weight:700;font-size:14px;margin:0}.ct{font:700 clamp(26px,6vw,38px)/1.2 Georgia,serif;margin:8px 0 0}.cm{color:var(--mute);margin:8px 0}.cn{font:italic 700 clamp(30px,8vw,48px)/1.2 Georgia,serif;margin:6px 0 10px;color:var(--vio);word-break:break-word}
.cf{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;color:var(--mute);font-size:14px}.sg{font:italic 700 24px Georgia,serif;color:var(--ink);border-top:1.5px solid var(--ora);padding:4px 18px 0}
@media print{@page{size:A4 landscape;margin:10mm}body *{visibility:hidden}#cert,#cert *{visibility:visible}#cert{position:absolute;left:0;top:0;width:100%;margin:0}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const Q=[
{t:"choice",q:"Qu’est-ce qu’un prompt ?",o:["Une consigne écrite que je donne à l’IA","Un mot de passe secret","Un jeu vidéo","La réponse de l’IA"],a:0,e:"Un prompt, c’est ta consigne. Plus elle est claire, plus l’IA t’aide bien."},
{t:"choice",q:"Tu veux une affiche pour l’anniversaire de ton frère. Quel prompt est le meilleur ?",o:["Fais une affiche.","Affiche dino","Fais une affiche d’anniversaire pour mon frère de 8 ans, thème dinosaures, couleurs vives, style dessin animé.","Quelque chose de beau, s’il te plaît."],a:2,e:"Le bon prompt dit pour qui, sur quel thème et dans quel style."},
{t:"choice",q:"Que faut-il ajouter à ta question pour que l’IA te comprenne mieux ?",o:["Un contexte : qui je suis, pour quoi faire","Beaucoup de points d’exclamation","Rien, l’IA devine tout","Un mot compliqué"],a:0,e:"Donner un contexte aide l’IA à viser juste."},
{t:"choice",q:"La première réponse de l’IA ne te plaît pas. Que fais-tu ?",o:["J’abandonne","Je précise ma demande et je redemande","J’accepte quand même","Je change d’ordinateur"],a:1,e:"On améliore une idée progressivement : précise, puis redemande."},
{t:"order",q:"Remets ce prompt dans l’ordre : contexte, demande, résultat souhaité.",items:["Je prépare une histoire pour mes camarades de 10 ans.","Propose-moi 3 idées de héros.","Réponds par une liste courte : un nom et un pouvoir par héros."],e:"On commence par le contexte, puis la demande, puis le résultat souhaité."},
{t:"choice",q:"Vrai ou faux : plus mon prompt est précis, plus la réponse ressemble à mon idée.",o:["Vrai","Faux"],a:0,e:"Vrai. La précision est la clé d’un bon résultat."},
{t:"choice",q:"Vrai ou faux : je dois toujours garder la première réponse de l’IA.",o:["Vrai","Faux"],a:1,e:"Faux. Tu peux la corriger, la compléter ou la rejeter."},
{t:"choice",q:"Pour ton projet « Mon idée du futur », qui décide à la fin ?",o:["L’IA","Moi, l’apprenant","Le hasard","Personne"],a:1,e:"L’humain imagine, l’IA accompagne, l’apprenant décide."}
];
const app=document.getElementById("app");let i=0,score=0,log=[],who="";
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(){i=0;score=0;log=[];app.innerHTML=`<p class="kick">Module 2 · IA et imagination</p><h1>Écris un bon prompt</h1><div class="bar"></div><p class="lead">${Q.length} questions pour vérifier ce que tu as appris : poser une bonne question, donner un contexte, décrire le résultat et améliorer une réponse. Tu as la correction après chaque question.</p><label class="lab" for="nm">Ton prénom (il apparaîtra sur ton certificat)</label><input id="nm" class="inp" maxlength="40" autocomplete="given-name" placeholder="Ex. : Sara"><button class="btn" id="go">Commencer le quiz</button>`;document.getElementById("go").onclick=()=>{who=document.getElementById("nm").value.trim();show()}}
function head(){return `<div class="prog"><span>Question ${i+1} sur ${Q.length}</span><div class="track"><div class="fill" style="width:${i/Q.length*100}%"></div></div><span>${score} pt</span></div>`}
function next(btnLabel){return `<div class="row"><button class="btn" id="nx">${btnLabel}</button></div>`}
function done(ok,q,extra){if(ok)score++;log.push({q:q.q,ok,e:q.e});const last=i===Q.length-1;
 const f=document.createElement("div");f.className="fb "+(ok?"ok":"ko");f.innerHTML=`<b>${ok?"Bravo !":"Pas tout à fait."}</b>${q.e}`;
 document.getElementById("card").appendChild(f);
 const r=document.createElement("div");r.innerHTML=next(last?"Voir mon résultat":"Question suivante");document.getElementById("card").appendChild(r);
 document.getElementById("nx").onclick=()=>{i++;last?end():show()};document.getElementById("nx").focus()}
function show(){const q=Q[i];app.innerHTML=head()+`<div class="card" id="card"><h2>${q.q}</h2><div id="body"></div></div>`;const b=document.getElementById("body");
 if(q.t==="choice"){q.o.forEach((t,k)=>{const x=document.createElement("button");x.className="opt";x.textContent=t;x.onclick=()=>{b.querySelectorAll(".opt").forEach((y,m)=>{y.disabled=true;if(m===q.a)y.classList.add("ok")});if(k!==q.a)x.classList.add("ko");done(k===q.a,q)};b.appendChild(x)})}
 else{const pick=[];const slots=document.createElement("div");const chips=document.createElement("div");chips.className="chips";
  const draw=()=>{slots.innerHTML="";q.items.forEach((_,k)=>{const s=document.createElement("div");s.className="slot"+(pick[k]!==undefined?" filled":"");s.innerHTML=pick[k]!==undefined?`<span class="n">${k+1}</span>${pick[k]}`:`<span class="n" style="background:var(--line);color:var(--mute)">${k+1}</span>Choisis la phrase n°${k+1}`;slots.appendChild(s)})};
  shuffle(q.items).forEach(t=>{const c=document.createElement("button");c.className="opt";c.textContent=t;c.onclick=()=>{pick.push(t);c.disabled=true;c.style.opacity=.4;draw();if(pick.length===q.items.length){const ok=pick.every((v,k)=>v===q.items[k]);slots.querySelectorAll(".slot").forEach((s,k)=>s.classList.add(pick[k]===q.items[k]?"ok":"ko"));if(!ok){const g=document.createElement("p");g.style.cssText="color:var(--mute);font-size:14px";g.textContent="Bon ordre : "+q.items.map((v,k)=>(k+1)+". "+v).join("  ");b.appendChild(g)}chips.querySelectorAll("button").forEach(z=>z.disabled=true);rs.disabled=true;done(ok,q)}};chips.appendChild(c)});
  const rs=document.createElement("button");rs.className="btn ghost";rs.textContent="Recommencer l’ordre";rs.onclick=show;
  draw();b.append(slots,chips,rs)}}
function cert(){const d=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});const n=who||"Apprenant(e) AYA";
return `<section class="cert" id="cert"><div class="cin"><p class="cs">AYA · Utiliser l’IA en créativité digitale avec les jeunes</p><h2 class="ct">Certificat d’achèvement</h2><div class="bar" style="margin:14px auto"></div><p class="cm">décerné à</p><p class="cn">${esc(n)}</p><p class="cm">pour avoir suivi le Module 2 et terminé le quiz<br><b>IA et imagination : créer des idées</b></p><div class="cf"><span>${d}</span><span class="sg">AYA</span></div></div></section><div class="row"><button class="btn" id="pr">Imprimer ou enregistrer en PDF</button></div>`}
function end(){const p=score/Q.length;const msg=p>=.85?"Excellent ! Tu sais écrire un bon prompt.":p>=.6?"Bien joué ! Encore un petit effort pour être au top.":"Bon début ! Relis la leçon sur les prompts puis réessaie.";
 app.innerHTML=`<p class="kick">Résultat</p><div class="card"><div class="score">${score}<span style="font-size:28px;color:var(--mute)"> / ${Q.length}</span></div><h2>${msg}</h2><div class="track"><div class="fill" style="width:${p*100}%"></div></div><div style="margin-top:18px">${log.map(l=>`<div class="rev"><b>${l.ok?"✔":"✘"} ${l.q}</b><small>${l.e}</small></div>`).join("")}</div><div class="row"><button class="btn" id="re">Refaire le quiz</button></div></div>${cert()}`;
 document.getElementById("re").onclick=start;document.getElementById("pr").onclick=()=>{try{window.print()}catch(e){alert("Fais une capture d’écran de ton certificat.")}}}
start();
</script>
</body>
</html>
